<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/global.css">
    <title>iconcert8's log</title>
    <style>
      body{
        padding-bottom: 0;
      }
      .home{
        max-width: 560px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 40px 16px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 24px;
      }
      .logo{
        height: 72px;
        width: auto;
        max-width: 100%;
        object-fit: contain;
      }
      .contact a{
        color: gray;
        text-decoration: none;
        font-size: small;
        margin: 0 6px;
      }
      .contact a:hover{
        color: black;
      }
      .menu{
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .menu-card{
        display: block;
        padding: 18px 12px;
        border: 1px solid #EEEEEE;
        border-radius: 16px;
        color: black;
        text-decoration: none;
        text-align: center;
        cursor: pointer;
        transition: background-color .2s, transform .2s;
      }
      .menu-card:hover{
        color: black;
        background-color: #F6F6F6;
        transform: translateY(-2px);
      }
      .menu-emoji{
        font-size: 28px;
      }
      .menu-desc{
        margin-top: 2px;
        font-size: x-small;
        color: gray;
      }
      #fishbowl{
        display: block;
        width: 100%;
        height: auto;
        background-color: #44C3BC;
        border-radius: 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="home">
      <div class="text-center">
        <img class="logo mb-3" src="/about/img/iconcert8.png" alt="iconcert8">
        <h1 class="mb-1">iconcert8's log</h1>
        <p class="mb-2" style="font-size: small;">Software Engineer · Backend</p>
        <div class="contact">
          <a href="https://github.com/iconcert8" target="_blank"><i class="bi bi-github"></i> GitHub</a>
          <a href="mailto:iconcert8@gmail.com"><i class="bi bi-envelope"></i> Email</a>
        </div>
      </div>

      <nav class="menu">
        <a id="about" class="menu-card">
          <div class="menu-emoji">🧑</div><strong>About</strong><div class="menu-desc">소개 · 경력 · 스택</div>
        </a>
        <a id="work" class="menu-card">
          <div class="menu-emoji">🛠️</div><strong>Work</strong><div class="menu-desc">문제를 풀었던 일 · 해온 일</div>
        </a>
      </nav>

      <canvas id="fishbowl" width="400" height="200"></canvas>
    </main>
    <script src="/js/fish-game.js"></script>
    <script>
      startFishGame(document.getElementById('fishbowl'));
    </script>
    <script src="/js/interval-text.js"></script>
    <script>
      const about = document.getElementById("about");
      registerMouseClickWriteIntevalText(about, '<div class="menu-emoji">🧑</div><strong>', '</strong><div class="menu-desc">소개 · 경력 · 스택</div>', '안녕하세요, 저는..', "/about/about.html");
      const work = document.getElementById("work");
      registerMouseClickWriteIntevalText(work, '<div class="menu-emoji">🛠️</div><strong>', '</strong><div class="menu-desc">문제를 풀었던 일 · 해온 일</div>', '이런 일을 했어요.', "/work/work.html");
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
  </body>
</html>
